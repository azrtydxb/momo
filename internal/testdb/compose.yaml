name: momo-test
services:
  postgres17:
    image: pgvector/pgvector:0.8.7-pg17
    environment: { POSTGRES_PASSWORD: momo, POSTGRES_USER: postgres }
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U postgres"],
        interval: 2s,
        retries: 30,
      }
  postgres16:
    image: pgvector/pgvector:0.8.7-pg16
    environment: { POSTGRES_PASSWORD: momo, POSTGRES_USER: postgres }
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U postgres"],
        interval: 2s,
        retries: 30,
      }
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    # Configured through the image's environment rather than mounted files, so it
    # works where the Docker host cannot share the checkout's path; CI's service
    # container sets the same variables. The URL names no database, so the image
    # writes a `* =` entry and every database is routed: the shared suite runs
    # through the pooler in its own scratch database. The image has no variable
    # for track_extra_parameters, so a startup search_path is not reliable here.
    environment:
      DATABASE_URL: postgres://postgres:momo@postgres17:5432
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      DEFAULT_POOL_SIZE: "4"
      MAX_CLIENT_CONN: "200"
      MAX_PREPARED_STATEMENTS: "0"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports: ["127.0.0.1:6432:5432"]
    depends_on: { postgres17: { condition: service_healthy } }
  mysql84:
    image: mysql:8.4.13
    environment: { MYSQL_ROOT_PASSWORD: momo }
    ports: ["127.0.0.1:3306:3306"]
    healthcheck:
      {
        test:
          ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmomo --silent"],
        interval: 2s,
        retries: 60,
      }
  mysql97:
    image: mysql:9.7.4
    environment: { MYSQL_ROOT_PASSWORD: momo }
    ports: ["127.0.0.1:3307:3306"]
    healthcheck:
      {
        test:
          ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmomo --silent"],
        interval: 2s,
        retries: 60,
      }
  mariadb118:
    image: mariadb:11.8.9
    environment: { MARIADB_ROOT_PASSWORD: momo }
    ports: ["127.0.0.1:3308:3306"]
    healthcheck:
      {
        test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"],
        interval: 2s,
        retries: 60,
      }
