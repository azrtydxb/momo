name: tmp-regen

on:
  push:
    branches: ["worktree-agent-*"]

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go generate ./...
      - run: git --no-pager diff --stat
      - uses: actions/upload-artifact@v7
        with:
          name: regen
          path: |
            README.md
            llms.txt
            docs/
