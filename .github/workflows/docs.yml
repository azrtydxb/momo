# Builds the documentation site and checks it: the strict MkDocs build, the
# llms.txt files, every Go code block, and the runnable blocks against
# PostgreSQL. Only main and version tags publish (mike, gh-pages); every other
# ref, including worktree-agent-* branches, builds and tests without deploying.
# Python is used here and nowhere else: ci.yml and the Go module have none.
name: docs

on:
  push:
    branches: ["main", "sprint-*", "worktree-agent-*"]
    tags: ["v*"]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/docs/**"
      - "examples/**"
      - "internal/docscheck/**"
      - ".github/workflows/docs.yml"
  # A release tag created by release-please with the workflow token does not
  # trigger the tag push above, so release-please.yml dispatches this
  # workflow with the new tag; an empty tag only builds.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish as /vX.Y/ and latest (empty: build only)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: "pgvector/pgvector:0.8.7-pg17"
        env:
          POSTGRES_PASSWORD: momo
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Install the pinned docs toolchain
        run: pip install --require-hashes -r docs/requirements.txt
      - name: Build the site (strict)
        run: mkdocs build --strict --site-dir site
      - name: Check llms.txt, llms-full.txt and the raw Markdown twins
        run: MOMO_DOCS_SITE="$PWD/site" go test -tags docs -count=1 -run '^TestLLMsTxt$' ./internal/docscheck/
      - name: Compile every Go code block
        run: go test -count=1 -v -run '^TestDocsCodeBlocks$' ./internal/docscheck/
      - name: Run the runnable Go code blocks against PostgreSQL
        run: go test -tags integration -count=1 -run '^TestDocsRunnableBlocks$' ./internal/docscheck/
        env:
          MOMO_REQUIRE_INTEGRATION: "1"
          MOMO_TEST_POSTGRES_URL: "postgres://postgres:momo@127.0.0.1:5432/postgres?sslmode=disable"
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          retention-days: 7

  deploy:
    needs: build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))))
      || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v') && !contains(inputs.tag, '-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deploy at a time across refs: mike pushes to the shared gh-pages branch.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install the pinned docs toolchain
        run: pip install --require-hashes -r docs/requirements.txt
      - name: Set the git identity for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish /dev/
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mike deploy --push dev
      - name: Publish the release version and move latest
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          version="${tag%.*}"
          mike deploy --push --update-aliases "$version" latest
          mike set-default --push latest
      # mike publishes only under /dev/, /vX.Y/ and /latest/, so the site root
      # has no llms.txt. Copy the release's files there. The links of llms.txt
      # are relative to a version directory, so they are pointed into latest/.
      - name: Copy llms.txt and llms-full.txt to the site root
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        run: |
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/pages" origin/gh-pages
          cd "$RUNNER_TEMP/pages"
          tag="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          src="${tag%.*}"
          sed 's#](\([^)]*\))#](latest/\1)#' "$src/llms.txt" > llms.txt
          cp "$src/llms-full.txt" llms-full.txt
          git add llms.txt llms-full.txt
          if git diff --cached --quiet; then
            echo "root llms files are current"
          else
            git commit -m "docs: root llms.txt and llms-full.txt from $tag"
            git push origin HEAD:gh-pages
          fi
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
