name: gosec

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  gosec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: securego/gosec@v2.30.0
        with:
          args: "-no-fail -exclude-dir=testdata -exclude-dir=.claude -exclude-dir=internal/compat/entfixture/ent -fmt sarif -out gosec.sarif ./..."
      # Fork pull requests get a read-only token, which cannot upload SARIF.
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
