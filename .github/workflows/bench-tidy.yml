name: bench-tidy
on:
  push:
    branches: ["worktree-agent-*-tidy"]
permissions:
  contents: read
jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: cd bench && go mod tidy
      - uses: actions/upload-artifact@v4
        with:
          name: bench-mod
          path: |
            bench/go.mod
            bench/go.sum
