# The integration matrix is the only place a dialect is enabled in CI.
name: ci

on:
  push:
    branches: [main, "sprint-*"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: make fmt-check
      - run: make vet
      - run: make staticcheck
      - run: make gosec
      - run: make tidy-check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"
      - run: make test
      - run: make test-sqlitepure

  compile-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: make test-compilefail

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: make test-race

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: make test-fuzz

  bench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - run: make bench-smoke

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.27"
          go-package: ./...

  # windows and macos run unit tests only: every test that needs a database
  # carries the integration build tag, so go test without the tag cannot
  # reach one. The integration job is the only place a database is used.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - run: go test ./...
      - run: go test -count=1 -tags integration ./driver/sqlitepure/... ./internal/sqlshared/...

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - run: CGO_ENABLED=1 go test ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
        pg: ["0.8.7-pg17", "0.8.7-pg16"]
        dialect: [postgres] # SQLite runs inside the postgres cell: testopen.Each and the sqlitedriver tests need no server. M3: add mysql84, mysql97, mariadb
    env:
      PG_URL: postgres://postgres:momo@127.0.0.1:5432/postgres?sslmode=disable
      PG_APP_URL: postgres://momo_app:momo_app@127.0.0.1:5432/postgres?sslmode=disable
      PGBOUNCER_URL: postgres://postgres:momo@127.0.0.1:6432/postgres?sslmode=disable
    services:
      postgres:
        image: "pgvector/pgvector:${{ matrix.pg }}"
        env:
          POSTGRES_PASSWORD: momo
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
      pgbouncer:
        image: "edoburu/pgbouncer:v1.26.1-p0"
        env:
          DATABASE_URL: "postgres://postgres:momo@postgres:5432"
          POOL_MODE: transaction
          AUTH_TYPE: scram-sha-256
          DEFAULT_POOL_SIZE: "4"
          MAX_CLIENT_CONN: "200"
          MAX_PREPARED_STATEMENTS: "0"
          IGNORE_STARTUP_PARAMETERS: extra_float_digits
        ports: ["6432:5432"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: make test-integration-${{ matrix.dialect }}

  # One server per matrix entry, so a failure names the server it ran against.
  # MOMO_INTEGRATION_DIALECTS (set by the make target) keeps the other
  # dialects' URLs from being required here.
  integration-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
        dialect: [mysql84, mysql97, mariadb]
        include:
          - dialect: mysql84
            image: "mysql:8.4.13"
            health: "mysqladmin ping -h 127.0.0.1 -uroot -pmomo --silent"
          - dialect: mysql97
            image: "mysql:9.7.4"
            health: "mysqladmin ping -h 127.0.0.1 -uroot -pmomo --silent"
          - dialect: mariadb
            image: "mariadb:11.8.9"
            health: "healthcheck.sh --connect --innodb_initialized"
    env:
      MYSQL84_URL: root:momo@tcp(127.0.0.1:3306)/
      MYSQL97_URL: root:momo@tcp(127.0.0.1:3306)/
      MARIADB_URL: root:momo@tcp(127.0.0.1:3306)/
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: momo
          MARIADB_ROOT_PASSWORD: momo
        ports: ["3306:3306"]
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 2s
          --health-retries 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: make test-integration-${{ matrix.dialect }}

  bench-module:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PG_URL: postgres://postgres:momo@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: "pgvector/pgvector:0.8.7-pg17"
        env:
          POSTGRES_PASSWORD: momo
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: make test-bench-module
      - run: make test-bench-module-integration
      - run: make bench-hooks
      - run: make bench-suite-smoke
      - run: make bench-gate
