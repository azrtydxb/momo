name: tmp-docref
on:
  push:
    branches: ["worktree-agent-a7cf2d2f3c34f9e49*"]
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go generate ./internal/gendocs/...
      - run: go test -count=1 -run 'TestDocsIdentifiersResolve|TestExportedIdentifiersDocumented|TestResolveRefRules|TestExtractRefs' ./internal/docscheck/ 2>&1 | tee docscheck.out || true
      - uses: actions/upload-artifact@v4
        with:
          name: docref
          path: |
            docs/reference.md
            docscheck.out
