# Temporary: resolves the gorm fixture module's requirements on CI (no Go on
# the author's machine) and prints go.mod and go.sum. Deleted once they are committed.
name: imp-gorm-tidy
on:
  push:
    branches: ["worktree-agent-*"]
    paths: ["internal/compat/gormfixture/tidy.trigger"]
permissions:
  contents: read
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - working-directory: internal/compat/gormfixture
        run: |
          go get gorm.io/gorm@latest gorm.io/driver/postgres@latest
          go mod tidy
          echo ---- go.mod; cat go.mod; echo ---- go.sum; cat go.sum
          go list -m -json gorm.io/gorm gorm.io/driver/postgres | grep -E '"(Path|Version|Time)"'
