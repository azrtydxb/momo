# TEMPORARY: regenerates the golden files and the committed example output of
# the ecosystem generators on CI, because they cannot be produced on the
# laptop. Removed before the branch merges.
name: regen-tmp

on:
  push:
    branches: ["worktree-agent-a358c0410dfa8de9b"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PG_URL: postgres://postgres:momo@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: "pgvector/pgvector:0.8.7-pg17"
        env:
          POSTGRES_PASSWORD: momo
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: make protoc
      - name: golden files
        continue-on-error: true
        run: go test -count=1 -update ./gen/openapi ./gen/graphql ./gen/grpc
      - name: docs
        continue-on-error: true
        run: go generate ./...
      - name: generate examples
        continue-on-error: true
        run: bash scripts/gen-integration.sh
      - name: tidy
        continue-on-error: true
        run: cd internal/integration && go mod tidy
      - name: vet
        continue-on-error: true
        run: cd internal/integration && go vet ./...
      - name: tests
        continue-on-error: true
        run: |
          cd internal/integration
          MOMO_REQUIRE_INTEGRATION=1 MOMO_TEST_POSTGRES_URL="$PG_URL" PROTOC="$PWD/protoc-dist/bin/protoc" go test -count=1 -v ./... 2>&1 | tail -250
      - uses: actions/upload-artifact@v7
        with:
          name: regenerated
          path: |
            README.md
            llms.txt
            docs/
            gen/openapi/testdata
            gen/graphql/testdata
            gen/grpc/testdata
            internal/integration/go.mod
            internal/integration/go.sum
            internal/integration/graphql/example
            internal/integration/grpc/example
            internal/integration/openapi/example
